<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="warmFlameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <filter id="flameGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Clean Contrast Dark Base -->
  <rect width="500" height="500" rx="110" fill="#18181b" stroke="#27272a" stroke-width="8" />

  <!-- Radiating Audio Wave Arcs -->
  <g stroke="url(#warmFlameGrad)" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.7">
    <path d="M 345 185 A 90 90 0 0 1 345 315" />
    <path d="M 380 150 A 140 140 0 0 1 380 350" stroke-width="6" opacity="0.4" />
  </g>

  <!-- Dynamic Equalizer Hand -->
  <g fill="url(#warmFlameGrad)" filter="url(#flameGlow)">
    <rect x="130" y="270" width="24" height="70" rx="12" />
    <rect x="170" y="180" width="24" height="160" rx="12" />
    <rect x="210" y="130" width="24" height="210" rx="12" />
    <rect x="250" y="170" width="24" height="170" rx="12" />
    <rect x="290" y="225" width="24" height="115" rx="12" />
    <path d="M 130 350 C 130 395, 175 410, 222 410 C 269 410, 314 395, 314 350 Z" />
  </g>
</svg>
